[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegprov"
version = "0.1.0"
description = "Provenance and quality tooling for EEG archives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mne>=1.6",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
edf = ["edfio>=0.4"]
# edfio is a test dependency, not just an extra: EDF is the dominant legacy
# archive format, so the reader path that matters most in the field has to be
# exercised against real EDF files rather than only FIF.
dev = ["pytest>=7.4", "edfio>=0.4"]

[project.scripts]
eegprov = "eegprov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
